server {
    listen 80 default_server backlog=4096;
    listen [::]:80 default_server backlog=4096;
    server_name 101.35.222.155;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl default_server backlog=4096;
    listen [::]:443 ssl default_server backlog=4096;
    server_name 101.35.222.155;

    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/cliproxy-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cliproxy-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:cliproxy_tls:10m;
    ssl_session_timeout 1d;

    # Codex histories can be large; the gateway applies no separate body cap.
    client_max_body_size 0;
    client_body_timeout 365d;
    send_timeout 365d;

    location /v1/ {
        proxy_pass http://127.0.0.1:8320;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;

        # This covers only establishing the local 127.0.0.1 connection. It
        # does not limit an established Codex request or response.
        proxy_connect_timeout 75s;
        # Responses/SSE may legitimately spend a long time thinking. Nginx
        # treats zero as an immediate timeout here, so use a one-year inactivity
        # timer and let the client or upstream close dead connections.
        proxy_send_timeout 365d;
        proxy_read_timeout 365d;
        proxy_next_upstream off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        return 404;
    }
}
