# Keep the accept/SYN queues large enough for bursts of long-lived Codex turns.
# These values remove a small kernel backlog bottleneck without changing any
# application-level accounting or authorization policy.
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096

# The fixed IEPL route has low RTT but substantial loss and reordering during
# large uploads. Cubic repeatedly collapses to a one- or two-packet congestion
# window there, so use paced BBR for new connections instead of treating every
# loss as a reason to stop sending.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
