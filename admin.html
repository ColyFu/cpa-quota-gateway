<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CPA Quota Gateway</title>
  <style>
    :root{color-scheme:light;--page:#f4f6f8;--surface:#fff;--ink:#17212b;--muted:#66727f;--line:#dce2e7;--line-strong:#c5cdd5;--blue:#1469a8;--blue-soft:#e8f2f9;--green:#18794e;--green-soft:#e8f5ee;--amber:#9a6700;--amber-soft:#fff4d6;--red:#b42318;--red-soft:#fff0ee;--shadow:0 1px 2px rgba(17,24,39,.06)}
    @media(prefers-color-scheme:dark){:root{color-scheme:dark;--page:#15191d;--surface:#20262b;--ink:#edf1f4;--muted:#a3adb6;--line:#364047;--line-strong:#4c5861;--blue:#78bceb;--blue-soft:#18384e;--green:#6dcc9d;--green-soft:#173b2b;--amber:#efc15e;--amber-soft:#453713;--red:#ff8a80;--red-soft:#48221f;--shadow:none}}
    *{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:0}button,input{font:inherit;letter-spacing:0}
    .shell{min-height:100vh}.topbar{height:64px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:11px}.mark{width:32px;height:32px;border-radius:6px;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:800;font-size:13px}.brand h1{font-size:17px;margin:0}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:1px}.top-actions{display:flex;align-items:center;gap:8px}
    main{max-width:1500px;margin:0 auto;padding:24px 28px 40px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);margin-bottom:18px}.metric{padding:16px 18px;border-right:1px solid var(--line)}.metric:last-child{border-right:0}.metric-label{color:var(--muted);font-size:12px;margin-bottom:5px}.metric-value{font-size:23px;font-weight:680;font-variant-numeric:tabular-nums}.metric-note{color:var(--muted);font-size:12px;margin-top:3px}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}.toolbar-left,.toolbar-right{display:flex;align-items:center;gap:8px}.search{height:36px;width:270px;border:1px solid var(--line-strong);border-radius:5px;background:var(--surface);color:var(--ink);padding:0 11px;outline:none}.search:focus{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}.count{color:var(--muted);font-size:13px}
    button{height:36px;border:1px solid var(--line-strong);border-radius:5px;background:var(--surface);color:var(--ink);padding:0 12px;cursor:pointer;font-weight:600}button:hover{border-color:var(--blue);color:var(--blue)}button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:var(--blue);border-color:var(--blue);color:white}.primary:hover{background:var(--blue);color:white;filter:brightness(.95)}.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--line))}.danger:hover{border-color:var(--red);color:var(--red);background:var(--red-soft)}.icon-btn{width:36px;padding:0;font-size:18px}.small-btn{height:30px;padding:0 9px;font-size:12px}
    .table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);overflow:auto}table{border-collapse:separate;border-spacing:0;width:100%;min-width:1240px}th,td{border-bottom:1px solid var(--line);padding:11px 10px;text-align:left;white-space:nowrap;vertical-align:middle}th{position:sticky;top:0;background:var(--surface);z-index:2;color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:700}tbody tr:hover{background:color-mix(in srgb,var(--blue-soft) 35%,transparent)}tbody tr:last-child td{border-bottom:0}.identity{display:block}.name{font-weight:650;max-width:150px;overflow:hidden;text-overflow:ellipsis}.key{color:var(--muted);font:12px ui-monospace,SFMono-Regular,Consolas,monospace}
    .money{min-width:185px}.money-line{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums;margin-bottom:6px}.money-line strong{font-size:13px}.money-line span{color:var(--muted);font-size:12px}.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--green);border-radius:3px}.bar.warn>i{background:var(--amber)}.bar.over>i{background:var(--red)}.period{font-variant-numeric:tabular-nums}.period strong{display:block;font-size:12px}.period span{color:var(--muted);font-size:11px}
    input[type=number],select{height:32px;border:1px solid var(--line-strong);border-radius:4px;background:var(--page);color:var(--ink);padding:0 7px;font-variant-numeric:tabular-nums}.limit{width:92px}.rpm,.conc{width:78px}.cycle-select{width:104px}.cycle-days{width:64px;margin-left:5px}.switch{position:relative;display:inline-block;width:36px;height:20px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;border-radius:10px;background:var(--line-strong);cursor:pointer;transition:.15s}.slider:before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;border-radius:50%;background:white;box-shadow:0 1px 2px #0003;transition:.15s}.switch input:checked+.slider{background:var(--green)}.switch input:checked+.slider:before{transform:translateX(16px)}.row-actions{display:flex;gap:6px}
    .empty{padding:48px;text-align:center;color:var(--muted)}.toast{position:fixed;right:22px;bottom:22px;min-width:230px;max-width:420px;padding:11px 14px;border-radius:5px;background:var(--ink);color:var(--surface);box-shadow:0 8px 24px #0003;transform:translateY(80px);opacity:0;transition:.2s;z-index:30}.toast.show{transform:none;opacity:1}.toast.error{background:var(--red);color:white}
    dialog{border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);padding:0;width:min(430px,calc(100vw - 32px));box-shadow:0 18px 60px #0005}dialog::backdrop{background:#10182080}.modal-head{padding:18px 20px 10px;font-size:17px;font-weight:700}.modal-body{padding:4px 20px 18px;color:var(--muted)}.modal-actions{border-top:1px solid var(--line);padding:12px 20px;display:flex;justify-content:flex-end;gap:8px}
    @media(max-width:800px){.topbar{padding:0 16px}.brand small{display:none}main{padding:18px 14px}.metrics{grid-template-columns:1fr 1fr}.metric:nth-child(2){border-right:0}.metric:nth-child(-n+2){border-bottom:1px solid var(--line)}.toolbar{align-items:stretch;flex-direction:column}.toolbar-left,.toolbar-right{justify-content:space-between}.search{width:100%}.metric-value{font-size:19px}}
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><div class="mark">CQ</div><div><h1>CPA Quota Gateway</h1><small>用户额度与请求策略</small></div></div>
    <div class="top-actions"><button id="refresh" class="icon-btn" title="刷新" aria-label="刷新">↻</button><button id="syncKeeper">同步 Keeper</button><button id="resetAll" class="danger">重置全部额度</button></div>
  </header>
  <main>
    <section class="metrics" aria-label="配额概览">
      <div class="metric"><div class="metric-label">本周期总用量</div><div class="metric-value" id="totalUsed">$0.00</div><div class="metric-note" id="totalLimit">总额度 $0.00</div></div>
      <div class="metric"><div class="metric-label">活跃用户</div><div class="metric-value" id="activeUsers">0</div><div class="metric-note" id="enabledUsers">0 个已启用</div></div>
      <div class="metric"><div class="metric-label">模型价格</div><div class="metric-value" id="priceCount">0</div><div class="metric-note">来自 CPA Usage Keeper</div></div>
      <div class="metric"><div class="metric-label">最近同步</div><div class="metric-value" id="syncTime">--:--</div><div class="metric-note" id="timezone">Asia/Shanghai</div></div>
    </section>
    <div class="toolbar">
      <div class="toolbar-left"><input id="search" class="search" type="search" placeholder="搜索别名或 API Key" autocomplete="off"><span id="count" class="count"></span></div>
      <div class="toolbar-right"><span class="count">金额单位 USD</span></div>
    </div>
    <div class="table-wrap">
      <table><thead><tr><th>用户</th><th>本周期用量</th><th>周期</th><th>额度</th><th>周期规则</th><th>RPM</th><th>并发</th><th>启用</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table>
      <div id="empty" class="empty" hidden>没有匹配的用户</div>
    </div>
  </main>
</div>
<dialog id="confirm"><div class="modal-head" id="confirmTitle">确认重置</div><div class="modal-body" id="confirmBody"></div><div class="modal-actions"><button id="cancel">取消</button><button id="confirmAction" class="danger">确认重置</button></div></dialog>
<div id="toast" class="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),rowsEl=$('#rows'),empty=$('#empty');let data=[],pending=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const date=s=>new Intl.DateTimeFormat('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(s));
function notify(text,error=false){const t=$('#toast');t.textContent=text;t.className='toast show'+(error?' error':'');clearTimeout(t.timer);t.timer=setTimeout(()=>t.className='toast',2600)}
function rowHTML(x){const pct=x.limit_usd>0?Math.min(100,x.used_usd/x.limit_usd*100):(x.used_usd?100:0),tone=pct>=100?'over':pct>=80?'warn':'',preset=x.cycle_type==='calendar_month'?'calendar_month':x.cycle_days===7?'days_7':x.cycle_days===30?'days_30':'custom';return `<tr data-key="${esc(x.key_hash)}" data-search="${esc((x.alias+' '+x.key_hint).toLowerCase())}"><td><div class="identity"><div class="name" title="${esc(x.alias)}">${esc(x.alias||'未命名用户')}</div><div class="key">${esc(x.key_hint)}</div></div></td><td><div class="money"><div class="money-line"><strong>${money(x.used_usd)}</strong><span>剩余 ${money(x.remaining_usd)}</span></div><div class="bar ${tone}"><i style="width:${pct}%"></i></div></div></td><td><div class="period"><strong>${date(x.period_started_at)} → ${date(x.period_ends_at)}</strong><span>${esc(x.cycle_label)}</span></div></td><td><input class="limit" type="number" min="0" step="10" value="${x.limit_usd}"></td><td><select class="cycle-select"><option value="calendar_month" ${preset==='calendar_month'?'selected':''}>自然月</option><option value="days_7" ${preset==='days_7'?'selected':''}>7 天</option><option value="days_30" ${preset==='days_30'?'selected':''}>30 天</option><option value="custom" ${preset==='custom'?'selected':''}>自定义</option></select><input class="cycle-days" type="number" min="1" max="3650" value="${x.cycle_days}" ${preset==='custom'?'':'hidden'}></td><td><input class="rpm" type="number" min="0" value="${x.rpm}"></td><td><input class="conc" type="number" min="0" value="${x.concurrency}"></td><td><label class="switch"><input class="enabled" type="checkbox" ${x.enabled?'checked':''}><span class="slider"></span></label></td><td><div class="row-actions"><button class="small-btn save">保存</button><button class="small-btn reset">重置</button></div></td></tr>`}
function render(){const q=$('#search').value.trim().toLowerCase(),filtered=data.filter(x=>(x.alias+' '+x.key_hint).toLowerCase().includes(q));rowsEl.innerHTML=filtered.map(rowHTML).join('');empty.hidden=filtered.length>0;$('#count').textContent=`${filtered.length} / ${data.length} 个用户`}
async function api(path,options={}){if(options.method&&options.method!=='GET')options.headers={...(options.headers||{}),'X-Quota-Admin-Request':'1'};const r=await fetch(path,options);let body={};try{body=await r.json()}catch{}if(!r.ok)throw Error(body.error||`请求失败 (${r.status})`);return body}
async function load(){const b=$('#refresh');b.disabled=true;try{const d=await api('/admin/summary');data=d.items;const m=d.meta;$('#totalUsed').textContent=money(m.used_usd);$('#totalLimit').textContent='总额度 '+money(m.limit_usd);$('#activeUsers').textContent=m.active_keys;$('#enabledUsers').textContent=m.enabled_keys+' 个已启用';$('#priceCount').textContent=m.price_count;$('#syncTime').textContent=m.last_sync_at?date(m.last_sync_at):'--:--';$('#timezone').textContent=d.timezone;render()}catch(e){notify(e.message,true)}finally{b.disabled=false}}
function cycleValue(tr){const v=tr.querySelector('.cycle-select').value;if(v==='calendar_month')return{cycle_type:'calendar_month',cycle_days:30};if(v==='days_7')return{cycle_type:'fixed_days',cycle_days:7};if(v==='days_30')return{cycle_type:'fixed_days',cycle_days:30};return{cycle_type:'fixed_days',cycle_days:Number(tr.querySelector('.cycle-days').value)}}
rowsEl.addEventListener('change',e=>{if(e.target.matches('.cycle-select'))e.target.closest('td').querySelector('.cycle-days').hidden=e.target.value!=='custom'});
rowsEl.addEventListener('click',async e=>{const tr=e.target.closest('tr');if(!tr)return;if(e.target.closest('.save')){const b=e.target;b.disabled=true;try{await api('/admin/policy',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({key_hash:tr.dataset.key,limit_usd:Number(tr.querySelector('.limit').value),...cycleValue(tr),rpm:Number(tr.querySelector('.rpm').value),concurrency:Number(tr.querySelector('.conc').value),enabled:tr.querySelector('.enabled').checked})});notify('策略已保存');await load()}catch(x){notify(x.message,true)}finally{b.disabled=false}}else if(e.target.closest('.reset')){const x=data.find(v=>v.key_hash===tr.dataset.key);pending={type:'one',key_hash:x.key_hash};$('#confirmTitle').textContent='重置用户额度';$('#confirmBody').textContent=`${x.alias||x.key_hint} 将从当前时刻开始一个新周期，历史流水会保留。`;$('#confirm').showModal()}});
$('#resetAll').onclick=()=>{pending={type:'all'};$('#confirmTitle').textContent='重置全部用户额度';$('#confirmBody').textContent='所有有效用户将从当前时刻开始各自的新周期，历史流水会保留。';$('#confirm').showModal()};
$('#confirmAction').onclick=async()=>{const b=$('#confirmAction');b.disabled=true;try{if(pending.type==='all'){const x=await api('/admin/reset-all',{method:'POST'});notify(`已重置 ${x.reset_count} 个用户`)}else{await api('/admin/policy/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key_hash:pending.key_hash})});notify('用户额度已重置')}$('#confirm').close();await load()}catch(e){notify(e.message,true)}finally{b.disabled=false;pending=null}};
$('#cancel').onclick=()=>$('#confirm').close();$('#refresh').onclick=load;$('#search').oninput=render;load();
$('#syncKeeper').onclick=async e=>{e.target.disabled=true;try{const x=await api('/admin/sync',{method:'POST'});notify(`已同步 ${x.key_count} 个用户和 ${x.price_count} 个模型价格`);await load()}catch(x){notify(x.message,true)}finally{e.target.disabled=false}};
</script>
</body>
</html>
